<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login - ForgetMeNot
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="auth-page">

    <div class="auth-container">


        <div class="logo-section">

            <div class="logo-icon">
                🧠
            </div>

            <h1>
                ForgetMeNot
            </h1>

            <p>
                Your intelligent reminder companion
            </p>

        </div>


        <div class="auth-card">

            <h2>
                Welcome Back 👋
            </h2>

            <p class="auth-subtitle">
                Login to continue
            </p>


            <form
                method="POST"
                action="/login"
            >

                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-input"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-input"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Login
                </button>

            </form>


            <div class="auth-footer">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
